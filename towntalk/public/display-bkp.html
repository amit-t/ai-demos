<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TownTalk</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #07070f;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: default;
      user-select: none;
    }

    /* ─── Ambient Background ─── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ─── Stats Bar ─── */
    #stats-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: linear-gradient(180deg, rgba(7, 7, 15, 0.95) 0%, rgba(7, 7, 15, 0) 100%);
      pointer-events: none;
    }

    #stats-bar>* {
      pointer-events: auto;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .stats-group {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #e2e8f0, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }

    .qr-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }

    .qr-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ─── Bubble SVG Layer ─── */
    #bubble-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
    }

    /* ─── Hint Bar ─── */
    #hint-bar {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    .hint-text {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(10px);
    }

    /* ─── Spotlight Overlay ─── */
    #spotlight {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 7, 15, 0.85);
      backdrop-filter: blur(20px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #spotlight.visible {
      display: flex;
      opacity: 1;
    }

    .spotlight-card {
      max-width: 800px;
      width: 90%;
      padding: 56px 64px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    #spotlight.visible .spotlight-card {
      transform: scale(1);
    }

    .spotlight-question {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    .spotlight-votes {
      font-size: 64px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .spotlight-votes-label {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .spotlight-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: inherit;
    }

    .spotlight-close:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    /* ─── QR Overlay ─── */
    #qr-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 7, 15, 0.92);
      backdrop-filter: blur(30px);
    }

    #qr-overlay.visible {
      display: flex;
    }

    .qr-container {
      text-align: center;
      animation: qrIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes qrIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .qr-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .qr-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 40px;
    }

    #qr-code {
      display: inline-block;
      padding: 24px;
      background: #fff;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    #qr-code canvas {
      display: block;
    }

    .qr-url {
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'SF Mono', 'Fira Code', monospace;
      letter-spacing: 0.5px;
    }

    .qr-close-hint {
      margin-top: 32px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.25);
    }

    /* ─── Simulation Banner ─── */
    #sim-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      padding: 8px 24px;
      background: rgba(234, 88, 12, 0.15);
      border: 1px solid rgba(234, 88, 12, 0.3);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      color: #fb923c;
      display: none;
    }

    #sim-banner.visible {
      display: block;
    }

    /* ─── Empty State ─── */
    #empty-state {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #empty-state.visible {
      opacity: 1;
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .empty-text {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.25);
      font-weight: 400;
    }
  </style>
</head>

<body>

  <!-- Background Canvas (starfield) -->
  <canvas id="bg-canvas"></canvas>

  <!-- Stats Bar -->
  <div id="stats-bar">
    <div class="logo">
      <div class="logo-icon">💬</div>
      TownTalk
    </div>
    <div class="stats-group">
      <div class="stat">
        <div class="stat-value" id="stat-questions">0</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-votes">0</div>
        <div class="stat-label">Votes</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-users">0</div>
        <div class="stat-label">Connected</div>
      </div>
      <button class="qr-btn" onclick="toggleQR()">
        <span>📱</span> Join
      </button>
    </div>
  </div>

  <!-- Bubble SVG -->
  <svg id="bubble-layer"></svg>

  <!-- Hint Bar -->
  <div id="hint-bar">
    <span class="hint-text">Click any bubble to spotlight · Press Q for QR code · S to simulate</span>
  </div>

  <!-- Empty State -->
  <div id="empty-state">
    <div class="empty-icon">💬</div>
    <div class="empty-text">Waiting for questions…</div>
  </div>

  <!-- Spotlight Overlay -->
  <div id="spotlight" onclick="closeSpotlight()">
    <div class="spotlight-card" onclick="event.stopPropagation()">
      <button class="spotlight-close" onclick="closeSpotlight()">✕</button>
      <div class="spotlight-question" id="spotlight-text"></div>
      <div class="spotlight-votes" id="spotlight-votes">0</div>
      <div class="spotlight-votes-label">votes</div>
    </div>
  </div>

  <!-- QR Overlay -->
  <div id="qr-overlay" onclick="toggleQR()">
    <div class="qr-container" onclick="event.stopPropagation()">
      <div class="qr-title">Join TownTalk</div>
      <div class="qr-subtitle">Scan with your phone camera to ask questions and vote</div>
      <div id="qr-code"></div>
      <div class="qr-url" id="qr-url"></div>
      <div id="tunnel-badge"
        style="display:none; margin-top:16px; font-size:14px; color:rgba(34,197,94,0.7); font-weight:500;"></div>
      <div class="qr-close-hint">Press Q or click outside to close</div>
    </div>
  </div>

  <!-- Simulation Banner -->
  <div id="sim-banner">⚡ Simulation Mode — generating fake activity</div>

  <!-- D3.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // CONFIG
    // ═══════════════════════════════════════════════════════════════
    const MAX_VISIBLE_BUBBLES = 35;
    const BUBBLE_MIN_RADIUS = 36;
    const BUBBLE_MAX_RADIUS = 130;
    const BUBBLE_PADDING = 8;

    // Color tiers
    const TIERS = [
      { min: 0, color: '#6366f1', glow: 'rgba(99,102,241,0.3)', label: 'indigo' },
      { min: 5, color: '#818cf8', glow: 'rgba(129,140,248,0.35)', label: 'light-indigo' },
      { min: 15, color: '#f59e0b', glow: 'rgba(245,158,11,0.4)', label: 'amber' },
      { min: 30, color: '#fbbf24', glow: 'rgba(251,191,36,0.5)', label: 'gold' },
      { min: 50, color: '#f472b6', glow: 'rgba(244,114,182,0.5)', label: 'pink' },
    ];

    function getTier(votes) {
      let tier = TIERS[ 0 ];
      for (const t of TIERS) {
        if (votes >= t.min) tier = t;
      }
      return tier;
    }

    function getRadius(votes) {
      return Math.min(BUBBLE_MAX_RADIUS, BUBBLE_MIN_RADIUS + Math.sqrt(votes) * 14);
    }

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    let questions = [];
    let stats = { totalQuestions: 0, totalVotes: 0, connectedUsers: 0 };
    let spotlightId = null;
    let simulating = false;
    let simInterval = null;
    let qrVisible = false;

    // ═══════════════════════════════════════════════════════════════
    // STARFIELD BACKGROUND
    // ═══════════════════════════════════════════════════════════════
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let stars = [];

    function initStarfield() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;

      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        r: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.4 + 0.1,
        speed: Math.random() * 0.003 + 0.001,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function drawStarfield(t) {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Gradient background
      const grad = bgCtx.createRadialGradient(
        bgCanvas.width * 0.5, bgCanvas.height * 0.5, 0,
        bgCanvas.width * 0.5, bgCanvas.height * 0.5, bgCanvas.width * 0.7
      );
      grad.addColorStop(0, '#0d0d2b');
      grad.addColorStop(1, '#07070f');
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Stars
      for (const s of stars) {
        const flicker = Math.sin(t * s.speed + s.phase) * 0.3 + 0.7;
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(180, 190, 255, ${s.alpha * flicker})`;
        bgCtx.fill();
      }

      requestAnimationFrame(drawStarfield);
    }

    initStarfield();
    requestAnimationFrame(drawStarfield);

    window.addEventListener('resize', () => {
      initStarfield();
      resizeSVG();
      if (simulation) simulation.alpha(0.3).restart();
    });

    // ═══════════════════════════════════════════════════════════════
    // D3 BUBBLE VISUALIZATION
    // ═══════════════════════════════════════════════════════════════
    const svg = d3.select('#bubble-layer');
    let simulation = null;
    let nodes = [];

    function resizeSVG() {
      svg.attr('width', window.innerWidth).attr('height', window.innerHeight);
    }
    resizeSVG();

    // SVG filter definitions for glow
    svg.append('defs').html(`
  <filter id="glow-indigo" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feFlood flood-color="#6366f1" flood-opacity="0.4" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feFlood flood-color="#f59e0b" flood-opacity="0.5" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="14" result="blur"/>
    <feFlood flood-color="#fbbf24" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="16" result="blur"/>
    <feFlood flood-color="#f472b6" flood-opacity="0.6" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
`);

    function getFilter(votes) {
      if (votes >= 50) return 'url(#glow-pink)';
      if (votes >= 30) return 'url(#glow-gold)';
      if (votes >= 15) return 'url(#glow-amber)';
      return 'url(#glow-indigo)';
    }

    function initSimulation() {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;

      simulation = d3.forceSimulation(nodes)
        .force('center', d3.forceCenter(cx, cy).strength(0.04))
        .force('charge', d3.forceManyBody().strength(-30))
        .force('collision', d3.forceCollide().radius(d => d.radius + BUBBLE_PADDING).strength(0.8))
        .force('x', d3.forceX(cx).strength(d => 0.02 + Math.min(d.votes, 50) * 0.001))
        .force('y', d3.forceY(cy).strength(d => 0.02 + Math.min(d.votes, 50) * 0.001))
        .velocityDecay(0.4)
        .alphaDecay(0.01)
        .on('tick', ticked);
    }

    function ticked() {
      const groups = svg.selectAll('.bubble-group')
        .data(nodes, d => d.id);

      // Enter
      const enter = groups.enter()
        .append('g')
        .attr('class', 'bubble-group')
        .style('cursor', 'pointer')
        .style('opacity', 0)
        .on('click', (event, d) => openSpotlight(d.id));

      enter.append('circle')
        .attr('class', 'bubble-circle')
        .attr('r', 0)
        .attr('fill', d => {
          const tier = getTier(d.votes);
          return tier.color;
        })
        .attr('fill-opacity', 0.12)
        .attr('stroke', d => getTier(d.votes).color)
        .attr('stroke-width', 1.5)
        .attr('stroke-opacity', 0.5)
        .attr('filter', d => getFilter(d.votes));

      enter.append('foreignObject')
        .attr('class', 'bubble-text-fo');

      enter.append('circle')
        .attr('class', 'vote-badge')
        .attr('fill', 'rgba(0,0,0,0.5)')
        .attr('stroke', 'rgba(255,255,255,0.15)')
        .attr('stroke-width', 1)
        .attr('r', 14);

      enter.append('text')
        .attr('class', 'vote-count')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('fill', '#fff')
        .attr('font-size', '11px')
        .attr('font-weight', '600')
        .attr('font-family', 'Inter, sans-serif');

      // Animate entry
      enter.transition().duration(600).ease(d3.easeCubicOut)
        .style('opacity', 1);

      enter.select('.bubble-circle')
        .transition().duration(700).ease(d3.easeElasticOut.amplitude(1).period(0.5))
        .attr('r', d => d.radius);

      // Update (merge enter + existing)
      const merged = groups.merge(enter);

      // Position groups
      merged.attr('transform', d => `translate(${d.x || 0},${d.y || 0})`);

      // Update circle properties smoothly
      merged.select('.bubble-circle')
        .attr('r', d => d.radius)
        .attr('fill', d => getTier(d.votes).color)
        .attr('stroke', d => getTier(d.votes).color)
        .attr('filter', d => getFilter(d.votes));

      // Pulse animation for popular questions
      merged.select('.bubble-circle')
        .attr('stroke-opacity', d => {
          if (d.votes >= 25) {
            return 0.4 + Math.sin(Date.now() / 500 + d.votes) * 0.3;
          }
          return 0.5;
        })
        .attr('stroke-width', d => d.votes >= 25 ? 2.5 : 1.5);

      // Update foreign object for text
      merged.select('.bubble-text-fo')
        .attr('x', d => -d.radius * 0.7)
        .attr('y', d => -d.radius * 0.55)
        .attr('width', d => d.radius * 1.4)
        .attr('height', d => d.radius * 1.1)
        .html(d => {
          const fontSize = Math.max(11, Math.min(16, d.radius / 5));
          return `<div xmlns="http://www.w3.org/1999/xhtml" style="
        width:100%; height:100%;
        display:flex; align-items:center; justify-content:center;
        text-align:center;
        font-family:Inter,sans-serif;
        font-size:${fontSize}px;
        font-weight:500;
        line-height:1.3;
        color:rgba(255,255,255,0.9);
        overflow:hidden;
        padding:4px;
        word-break:break-word;
      ">${escapeHtml(truncate(d.text, d.radius < 50 ? 40 : 100))}</div>`;
        });

      // Vote badge position (top-right of bubble)
      merged.select('.vote-badge')
        .attr('cx', d => d.radius * 0.65)
        .attr('cy', d => -d.radius * 0.65);

      merged.select('.vote-count')
        .attr('x', d => d.radius * 0.65)
        .attr('y', d => -d.radius * 0.65)
        .text(d => d.votes);

      // Exit
      groups.exit()
        .transition().duration(400).ease(d3.easeCubicIn)
        .style('opacity', 0)
        .attr('transform', d => `translate(${d.x},${d.y}) scale(0.3)`)
        .remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function truncate(text, max) {
      return text.length > max ? text.slice(0, max - 1) + '…' : text;
    }

    // ═══════════════════════════════════════════════════════════════
    // UPDATE FROM SERVER STATE
    // ═══════════════════════════════════════════════════════════════
    function updateFromState(newQuestions, newStats) {
      questions = newQuestions;
      stats = newStats;

      // Update stat counters with animation
      animateCounter('stat-questions', stats.totalQuestions);
      animateCounter('stat-votes', stats.totalVotes);
      animateCounter('stat-users', stats.connectedUsers);

      // Show/hide empty state
      const emptyEl = document.getElementById('empty-state');
      if (questions.length === 0) {
        emptyEl.classList.add('visible');
      } else {
        emptyEl.classList.remove('visible');
      }

      // Take top N questions for visible bubbles
      const visible = questions.slice(0, MAX_VISIBLE_BUBBLES);

      // Update nodes array (preserve positions for existing nodes)
      const existingMap = new Map(nodes.map(n => [ n.id, n ]));
      const newNodes = visible.map(q => {
        const existing = existingMap.get(q.id);
        const radius = getRadius(q.votes);
        if (existing) {
          existing.votes = q.votes;
          existing.text = q.text;
          existing.radius = radius;
          return existing;
        }
        return {
          id: q.id,
          text: q.text,
          votes: q.votes,
          radius,
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 200,
          y: window.innerHeight / 2 + (Math.random() - 0.5) * 200,
        };
      });

      nodes = newNodes;

      if (simulation) {
        simulation.nodes(nodes);
        simulation.force('collision').radius(d => d.radius + BUBBLE_PADDING);
        simulation.alpha(0.4).restart();
      } else {
        initSimulation();
      }

      // Update spotlight if open
      if (spotlightId) {
        const q = questions.find(q => q.id === spotlightId);
        if (q) {
          document.getElementById('spotlight-votes').textContent = q.votes;
        }
      }
    }

    // Animated counter
    function animateCounter(elId, target) {
      const el = document.getElementById(elId);
      const current = parseInt(el.textContent) || 0;
      if (current === target) return;

      const diff = target - current;
      const steps = Math.min(Math.abs(diff), 20);
      const stepTime = 300 / steps;
      let step = 0;

      const interval = setInterval(() => {
        step++;
        const progress = step / steps;
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(current + diff * eased);
        if (step >= steps) {
          el.textContent = target;
          clearInterval(interval);
        }
      }, stepTime);
    }

    // ═══════════════════════════════════════════════════════════════
    // SPOTLIGHT
    // ═══════════════════════════════════════════════════════════════
    function openSpotlight(id) {
      const q = questions.find(q => q.id === id);
      if (!q) return;

      spotlightId = id;
      document.getElementById('spotlight-text').textContent = q.text;
      document.getElementById('spotlight-votes').textContent = q.votes;

      const el = document.getElementById('spotlight');
      el.style.display = 'flex';
      requestAnimationFrame(() => el.classList.add('visible'));
    }

    function closeSpotlight() {
      spotlightId = null;
      const el = document.getElementById('spotlight');
      el.classList.remove('visible');
      setTimeout(() => { el.style.display = 'none'; }, 400);
    }

    // ═══════════════════════════════════════════════════════════════
    // QR CODE
    // ═══════════════════════════════════════════════════════════════
    let qrGenerated = false;
    let lastQRUrl = '';

    async function generateQR(forceRefresh) {
      try {
        const res = await fetch('/api/info');
        const info = await res.json();
        const mobileUrl = `${info.url}/mobile.html`;

        // Skip if URL hasn't changed (unless forced)
        if (qrGenerated && mobileUrl === lastQRUrl && !forceRefresh) return;

        document.getElementById('qr-code').innerHTML = '';
        new QRCode(document.getElementById('qr-code'), {
          text: mobileUrl,
          width: 280,
          height: 280,
          colorDark: '#1a1a2e',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });

        document.getElementById('qr-url').textContent = mobileUrl;
        lastQRUrl = mobileUrl;
        qrGenerated = true;

        // Show tunnel badge if using public URL
        const badge = document.getElementById('tunnel-badge');
        if (info.tunnelUrl) {
          badge.textContent = '🌐 Public URL — works from any network';
          badge.style.display = 'block';
        } else {
          badge.textContent = '📡 Local network only — same WiFi required';
          badge.style.display = 'block';
          badge.style.color = 'rgba(251,191,36,0.6)';
        }
      } catch (e) {
        document.getElementById('qr-url').textContent = 'Could not detect network address';
      }
    }

    // Poll for tunnel URL changes (in case tunnel starts after page loads)
    setInterval(async () => {
      try {
        const res = await fetch('/api/info');
        const info = await res.json();
        const newUrl = `${info.url}/mobile.html`;
        if (newUrl !== lastQRUrl && qrGenerated) {
          console.log('Tunnel URL changed, regenerating QR code');
          generateQR(true);
        }
      } catch (e) { /* ignore */ }
    }, 5000);

    function toggleQR() {
      qrVisible = !qrVisible;
      const el = document.getElementById('qr-overlay');
      if (qrVisible) {
        generateQR();
        el.classList.add('visible');
      } else {
        el.classList.remove('visible');
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // SIMULATION MODE
    // ═══════════════════════════════════════════════════════════════
    const SIM_QUESTIONS = [
      "What's the biggest challenge we face this year?",
      "How can we improve onboarding for new hires?",
      "Should we invest more in developer tooling?",
      "What's one process you'd eliminate?",
      "How do you feel about our hybrid work policy?",
      "What would you build if you had a free week?",
      "How can we improve cross-team communication?",
      "What training would help you grow?",
      "Should we host more social events?",
      "How can leadership be more transparent?",
      "What's our biggest competitive advantage?",
      "How do we attract better talent?",
      "What should we stop doing?",
      "How can we move faster?",
      "What's the best idea nobody's tried yet?",
    ];

    let simQuestionIdx = 0;

    function toggleSimulation() {
      simulating = !simulating;
      document.getElementById('sim-banner').classList.toggle('visible', simulating);

      if (simulating) {
        simInterval = setInterval(() => {
          // Randomly either add a question or upvote
          if (Math.random() < 0.3 && questions.length < 30) {
            // Add new question
            const text = SIM_QUESTIONS[ simQuestionIdx % SIM_QUESTIONS.length ];
            simQuestionIdx++;
            ws.send(JSON.stringify({ type: 'submit', text, clientId: 'sim-' + Math.random() }));
          } else if (questions.length > 0) {
            // Upvote a random question (weighted toward popular ones)
            const weights = questions.map(q => 1 + q.votes * 0.5);
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * totalWeight;
            let idx = 0;
            for (let i = 0; i < weights.length; i++) {
              r -= weights[ i ];
              if (r <= 0) { idx = i; break; }
            }
            const q = questions[ idx ];
            if (q) {
              ws.send(JSON.stringify({
                type: 'upvote',
                questionId: q.id,
                clientId: 'sim-' + Math.random().toString(36).slice(2),
              }));
            }
          }
        }, 400);
      } else {
        clearInterval(simInterval);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // KEYBOARD SHORTCUTS
    // ═══════════════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      if (e.key === 'q' || e.key === 'Q') toggleQR();
      if (e.key === 's' || e.key === 'S') toggleSimulation();
      if (e.key === 'Escape') {
        if (qrVisible) toggleQR();
        else closeSpotlight();
      }
      if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
      if (e.key === 'r' || e.key === 'R') {
        if (!qrVisible && !spotlightId) {
          ws.send(JSON.stringify({ type: 'reset' }));
        }
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // WEBSOCKET CONNECTION
    // ═══════════════════════════════════════════════════════════════
    let ws;
    let reconnectTimer;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', role: 'display', clientId: 'display-main' }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'state') {
            updateFromState(msg.questions, msg.stats);
          } else if (msg.type === 'stats') {
            stats = { ...stats, ...msg };
            animateCounter('stat-questions', stats.totalQuestions);
            animateCounter('stat-votes', stats.totalVotes);
            animateCounter('stat-users', stats.connectedUsers);
          }
        } catch (e) { /* ignore */ }
      };

      ws.onclose = () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>

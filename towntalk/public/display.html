<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TownTalk — Live Q&A</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #07070f;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #viz {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #stats-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: linear-gradient(180deg, rgba(7, 7, 15, 0.92) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      pointer-events: none;
    }

    #stats-bar>* {
      pointer-events: auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      font-size: 26px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #e0e7ff;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
    }

    .join-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(129, 140, 248, 0.4);
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .join-btn:hover {
      background: rgba(99, 102, 241, 0.3);
      border-color: rgba(129, 140, 248, 0.7);
    }

    .bubble-text {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100%;
      padding: 4px;
      line-height: 1.3;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <canvas id="starfield"></canvas>

  <svg id="viz">
    <defs>
      <filter id="glow-0" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
        <feFlood flood-color="#6366f1" flood-opacity="0.35" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-1" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#818cf8" flood-opacity="0.40" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
        <feFlood flood-color="#f59e0b" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-3" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
        <feFlood flood-color="#fbbf24" flood-opacity="0.50" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-4" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur" />
        <feFlood flood-color="#f472b6" flood-opacity="0.55" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div id="stats-bar">
    <div class="logo">
      <span class="logo-icon">💬</span>
      <span>TownTalk</span>
    </div>
    <div class="stats-right">
      <div class="stat-item">
        <span class="stat-value" id="stat-questions">0</span>
        <span class="stat-label">Questions</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-votes">0</span>
        <span class="stat-label">Votes</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-connected">0</span>
        <span class="stat-label">Connected</span>
      </div>
      <a class="join-btn" href="/mobile.html" target="_blank">Join</a>
    </div>
  </div>

  <script>
    (function () {
      // ── Dimensions ──
      let W = window.innerWidth;
      let H = window.innerHeight;

      // ── Starfield ──
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      const STAR_COUNT = 120;
      let stars = [];

      function initStars() {
        canvas.width = W;
        canvas.height = H;
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.4 + 0.4,
            speed: Math.random() * 0.8 + 0.3,
            phase: Math.random() * Math.PI * 2
          });
        }
      }
      initStars();

      function drawStars(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          const alpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(drawStars);
      }
      requestAnimationFrame(drawStars);

      // ── SVG Setup ──
      const svg = d3.select('#viz');
      svg.attr('width', W).attr('height', H);
      const g = svg.append('g');

      // ── Resize handler ──
      window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        // Re-scatter stars on resize
        for (const s of stars) {
          s.x = Math.random() * W;
          s.y = Math.random() * H;
        }
        svg.attr('width', W).attr('height', H);
        simulation.force('center', d3.forceCenter(W / 2, H / 2));
        simulation.force('x', d3.forceX(W / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)));
        simulation.force('y', d3.forceY(H / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)));
        simulation.alpha(0.3).restart();
      });

      // ── Helpers ──
      function getRadius(votes) {
        return Math.min(130, 36 + Math.sqrt(votes) * 14);
      }

      function getTier(votes) {
        if (votes >= 50) return 4;
        if (votes >= 30) return 3;
        if (votes >= 15) return 2;
        if (votes >= 5) return 1;
        return 0;
      }

      const TIER_COLORS = [ '#6366f1', '#818cf8', '#f59e0b', '#fbbf24', '#f472b6' ];

      function getTierColor(votes) {
        return TIER_COLORS[ getTier(votes) ];
      }

      function getTierGlow(votes) {
        return `url(#glow-${getTier(votes)})`;
      }

      // ── D3 Force Simulation ──
      let nodes = [];

      const simulation = d3.forceSimulation(nodes)
        .force('center', d3.forceCenter(W / 2, H / 2))
        .force('charge', d3.forceManyBody().strength(-80))
        .force('collision', d3.forceCollide(d => getRadius(d.votes) + 6).strength(0.9))
        .force('x', d3.forceX(W / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)))
        .force('y', d3.forceY(H / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)))
        .alphaDecay(0.015)
        .velocityDecay(0.35)
        .on('tick', () => {
          g.selectAll('.bubble').attr('transform', d => `translate(${d.x},${d.y})`);
        });

      // ── Stats animation ──
      const displayedStats = { totalQuestions: 0, totalVotes: 0, connectedUsers: 0 };
      const targetStats = { totalQuestions: 0, totalVotes: 0, connectedUsers: 0 };
      let statsAnimating = false;

      function animateStats() {
        let done = true;
        for (const key of [ 'totalQuestions', 'totalVotes', 'connectedUsers' ]) {
          if (displayedStats[ key ] !== targetStats[ key ]) {
            done = false;
            const diff = targetStats[ key ] - displayedStats[ key ];
            const step = Math.sign(diff) * Math.max(1, Math.abs(Math.round(diff * 0.15)));
            if (Math.abs(diff) <= Math.abs(step)) {
              displayedStats[ key ] = targetStats[ key ];
            } else {
              displayedStats[ key ] += step;
            }
          }
        }
        document.getElementById('stat-questions').textContent = displayedStats.totalQuestions;
        document.getElementById('stat-votes').textContent = displayedStats.totalVotes;
        document.getElementById('stat-connected').textContent = displayedStats.connectedUsers;
        if (!done) {
          requestAnimationFrame(animateStats);
        } else {
          statsAnimating = false;
        }
      }

      function updateStats(stats) {
        targetStats.totalQuestions = stats.totalQuestions || 0;
        targetStats.totalVotes = stats.totalVotes || 0;
        targetStats.connectedUsers = stats.connectedUsers || 0;
        if (!statsAnimating) {
          statsAnimating = true;
          requestAnimationFrame(animateStats);
        }
      }

      // ── Render ──
      function render(questions, stats) {
        updateStats(stats);

        const incoming = questions || [];
        const incomingMap = new Map(incoming.map(q => [ q.id, q ]));
        const existingMap = new Map(nodes.map(n => [ n.id, n ]));

        // Remove deleted
        for (let i = nodes.length - 1; i >= 0; i--) {
          if (!incomingMap.has(nodes[ i ].id)) {
            nodes.splice(i, 1);
          }
        }

        // Update existing + add new
        for (const q of incoming) {
          const existing = existingMap.get(q.id);
          if (existing) {
            existing.votes = q.votes;
            existing.text = q.text;
          } else {
            nodes.push({
              id: q.id,
              text: q.text,
              votes: q.votes,
              timestamp: q.timestamp,
              x: W / 2 + (Math.random() - 0.5) * 80,
              y: H / 2 + (Math.random() - 0.5) * 80
            });
          }
        }

        // D3 data join
        const bubbles = g.selectAll('.bubble').data(nodes, d => d.id);

        // EXIT
        bubbles.exit().transition().duration(400).style('opacity', 0).remove();

        // ENTER
        const enter = bubbles.enter().append('g').attr('class', 'bubble')
          .attr('transform', d => `translate(${d.x},${d.y}) scale(0)`)
          .style('opacity', 0);

        enter.append('circle')
          .attr('r', d => getRadius(d.votes))
          .attr('fill', d => getTierColor(d.votes))
          .attr('fill-opacity', 0.18)
          .attr('stroke', d => getTierColor(d.votes))
          .attr('stroke-width', 1.5)
          .attr('filter', d => getTierGlow(d.votes));

        enter.append('foreignObject')
          .attr('x', d => -getRadius(d.votes) * 0.7)
          .attr('y', d => -getRadius(d.votes) * 0.7)
          .attr('width', d => getRadius(d.votes) * 1.4)
          .attr('height', d => getRadius(d.votes) * 1.4)
          .append('xhtml:div')
          .attr('class', 'bubble-text')
          .text(d => d.text);

        // Vote badge
        enter.append('circle')
          .attr('class', 'badge-circle')
          .attr('cx', d => getRadius(d.votes) * 0.55)
          .attr('cy', d => -getRadius(d.votes) * 0.55)
          .attr('r', 14)
          .attr('fill', d => getTierColor(d.votes))
          .attr('fill-opacity', 0.85);

        enter.append('text')
          .attr('class', 'badge-text')
          .attr('x', d => getRadius(d.votes) * 0.55)
          .attr('y', d => -getRadius(d.votes) * 0.55)
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'central')
          .attr('fill', '#fff')
          .attr('font-size', '11px')
          .attr('font-weight', '700')
          .text(d => d.votes);

        // Animate entrance
        enter.transition().duration(800)
          .ease(d3.easeElasticOut.amplitude(1).period(0.4))
          .attr('transform', d => `translate(${d.x},${d.y}) scale(1)`)
          .style('opacity', 1);

        // MERGE
        const merged = enter.merge(bubbles);

        merged.select('circle:first-of-type')
          .transition().duration(400)
          .attr('r', d => getRadius(d.votes))
          .attr('fill', d => getTierColor(d.votes))
          .attr('stroke', d => getTierColor(d.votes))
          .attr('filter', d => getTierGlow(d.votes));

        merged.select('foreignObject')
          .transition().duration(400)
          .attr('x', d => -getRadius(d.votes) * 0.7)
          .attr('y', d => -getRadius(d.votes) * 0.7)
          .attr('width', d => getRadius(d.votes) * 1.4)
          .attr('height', d => getRadius(d.votes) * 1.4);

        merged.select('foreignObject div').text(d => d.text);

        merged.select('.badge-circle')
          .transition().duration(400)
          .attr('cx', d => getRadius(d.votes) * 0.55)
          .attr('cy', d => -getRadius(d.votes) * 0.55)
          .attr('fill', d => getTierColor(d.votes));

        merged.select('.badge-text')
          .text(d => d.votes)
          .transition().duration(400)
          .attr('x', d => getRadius(d.votes) * 0.55)
          .attr('y', d => -getRadius(d.votes) * 0.55);

        // Restart simulation
        simulation.nodes(nodes);
        simulation.force('collision', d3.forceCollide(d => getRadius(d.votes) + 6).strength(0.9));
        simulation.alpha(0.4).restart();
      }

      // ── WebSocket ──
      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(protocol + location.host);

        ws.addEventListener('open', () => {
          ws.send(JSON.stringify({ type: 'join', role: 'display', clientId: 'display-main' }));
        });

        ws.addEventListener('message', (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'state') {
              render(msg.questions, msg.stats);
            }
          } catch (e) {
            console.error('Parse error:', e);
          }
        });

        ws.addEventListener('close', () => {
          setTimeout(connect, 2000);
        });

        ws.addEventListener('error', () => {
          ws.close();
        });
      }

      connect();
    })();
  </script>
</body>

</html>

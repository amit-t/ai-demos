<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TownTalk — Live Display</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #07070f;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #viz {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Stats Bar */
    #stats-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 56px;
      background: linear-gradient(180deg, rgba(7, 7, 15, 0.92) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
    }

    .logo-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #94a3b8;
    }

    .stat-value {
      font-weight: 700;
      font-size: 16px;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    .join-btn {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }

    .join-btn:hover {
      background: rgba(99, 102, 241, 0.25);
    }

    /* Bubble text */
    .bubble-text {
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      width: 100%;
      height: 100%;
      padding: 4px;
      line-height: 1.3;
      overflow: hidden;
    }

    /* Spotlight overlay */
    #spotlight {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(7, 7, 15, 0.85);
      backdrop-filter: blur(20px);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #spotlight.open {
      display: flex;
      opacity: 1;
    }

    .spotlight-card {
      max-width: 800px;
      width: 90%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #spotlight.open .spotlight-card {
      transform: scale(1);
    }

    .spotlight-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #64748b;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .spotlight-close:hover {
      color: #fff;
    }

    .spotlight-question {
      font-size: 38px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 32px;
      color: #f1f5f9;
    }

    .spotlight-votes {
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .spotlight-votes-label {
      font-size: 16px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 500;
    }

    /* QR Overlay */
    #qr-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(7, 7, 15, 0.9);
      backdrop-filter: blur(24px);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #qr-overlay.open {
      display: flex;
      opacity: 1;
    }

    .qr-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #qr-overlay.open .qr-card {
      transform: scale(1);
    }

    .qr-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .qr-subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .qr-container {
      display: inline-block;
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .qr-url {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      color: #818cf8;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .qr-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .qr-badge.public {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .qr-badge.local {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* Simulation banner */
    #sim-banner {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #f97316;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 10;
      display: none;
      font-weight: 500;
    }

    /* Hint bar */
    #hint-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.4;
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>

<body>

  <canvas id="starfield"></canvas>

  <svg id="viz">
    <defs>
      <filter id="glow-0" x="-50%" y="-50%" width="200%" height="200%">

        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#00E5FF" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>

      <filter id="glow-2" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#FFE600" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-3" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#FF6B00" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />

      </filter>
      <filter id="glow-4" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#A855F7" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>

        </feMerge>
      </filter>
      <filter id="glow-5" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#22DD44" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>

        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#FF44CC" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-7" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#4488FF" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-8" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#FF2200" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-9" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
        <feFlood flood-color="#CCFF00" flood-opacity="0.45" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="shadow" />
        <feMerge>
          <feMergeNode in="shadow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div id="stats-bar">
    <div class="logo">
      <span class="logo-icon">💬</span>
      <span>TownTalk</span>
    </div>
    <div class="stats-right">
      <div class="stat-item">
        <span>Questions</span>
        <span class="stat-value" id="stat-questions">0</span>
      </div>
      <div class="stat-item">
        <span>Votes</span>
        <span class="stat-value" id="stat-votes">0</span>
      </div>
      <div class="stat-item">
        <span>Connected</span>
        <span class="stat-value" id="stat-connected">0</span>
      </div>
      <a class="join-btn" href="/mobile.html" target="_blank">Join</a>
    </div>
  </div>

  <div id="spotlight">
    <div class="spotlight-card">
      <button class="spotlight-close" onclick="closeSpotlight()">&times;</button>
      <div class="spotlight-question" id="spotlight-question"></div>
      <div class="spotlight-votes" id="spotlight-votes">0</div>
      <div class="spotlight-votes-label">votes</div>
    </div>
  </div>

  <div id="qr-overlay">
    <div class="qr-card">
      <div class="qr-title">Join TownTalk</div>
      <div class="qr-subtitle">Scan the QR code to participate</div>
      <div class="qr-container" id="qr-container"></div>
      <div class="qr-url" id="qr-url"></div>
      <div id="qr-badge-container"></div>
    </div>
  </div>

  <div id="sim-banner">⚡ Simulation Mode</div>

  <div id="hint-bar">Click any bubble to spotlight · Press Q for QR code · Press S to simulate</div>

  <script>
    (function () {
      // ─── Dimensions ───
      let W = window.innerWidth;
      let H = window.innerHeight;

      // ─── Starfield ───
      const starCanvas = document.getElementById('starfield');
      const starCtx = starCanvas.getContext('2d');
      const stars = [];
      const STAR_COUNT = 120;

      function initStars() {
        starCanvas.width = W;
        starCanvas.height = H;
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.5 + 0.5,
            speed: Math.random() * 0.8 + 0.3,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawStars(t) {
        starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
        for (const s of stars) {
          const alpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.phase));
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          starCtx.fillStyle = `rgba(255,255,255,${alpha})`;
          starCtx.fill();
        }
        requestAnimationFrame(drawStars);
      }

      initStars();
      requestAnimationFrame(drawStars);

      // ─── SVG Setup ───
      const svg = d3.select('#viz');
      svg.attr('width', W).attr('height', H);
      const g = svg.append('g');

      // ─── Helpers ───
      function getRadius(votes) {
        return Math.min(130, 36 + Math.sqrt(votes) * 14);
      }

      const neoBrutPalette = [
        '#FF3366',  // hot pink
        '#00E5FF',  // electric cyan
        '#FFE600',  // brutal yellow
        '#FF6B00',  // blaze orange
        '#A855F7',  // vivid purple
        '#22DD44',  // neon green
        '#FF44CC',  // magenta
        '#4488FF',  // bold blue
        '#FF2200',  // fire red
        '#CCFF00',  // acid lime
      ];

      function hashId(id) {
        let h = 0;
        for (let i = 0; i < id.length; i++) {
          h = ((h << 5) - h + id.charCodeAt(i)) | 0;
        }
        return Math.abs(h);
      }

      function getBubbleColor(d) { return neoBrutPalette[ hashId(d.id) % neoBrutPalette.length ]; }
      function getBubbleGlow(d) { return `url(#glow-${hashId(d.id) % neoBrutPalette.length})`; }

      // ─── D3 Force Simulation ───
      let nodes = [];

      const simulation = d3.forceSimulation(nodes)
        .force('center', d3.forceCenter(W / 2, H / 2))
        .force('charge', d3.forceManyBody().strength(-80))
        .force('collision', d3.forceCollide(d => getRadius(d.votes) + 6).strength(0.9))
        .force('x', d3.forceX(W / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)))
        .force('y', d3.forceY(H / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)))
        .alphaDecay(0.015)
        .velocityDecay(0.35)
        .on('tick', () => {
          g.selectAll('.bubble').attr('transform', d => `translate(${d.x},${d.y})`);
        });

      // ─── Render ───
      function renderState(questions, stats) {
        updateStats(stats);

        const serverIds = new Set(questions.map(q => q.id));
        const existingMap = new Map(nodes.map(n => [ n.id, n ]));

        const newNodes = [];
        for (const q of questions) {
          const existing = existingMap.get(q.id);
          if (existing) {
            existing.votes = q.votes;
            existing.text = q.text;
            newNodes.push(existing);
          } else {
            newNodes.push({
              id: q.id,
              text: q.text,
              votes: q.votes,
              timestamp: q.timestamp,
              x: W / 2 + (Math.random() - 0.5) * 100,
              y: H / 2 + (Math.random() - 0.5) * 100,
              vx: 0,
              vy: 0
            });
          }
        }
        nodes = newNodes;

        // Data join
        const bubbles = g.selectAll('.bubble').data(nodes, d => d.id);

        // EXIT
        bubbles.exit().transition().duration(400).style('opacity', 0).remove();

        // ENTER
        const enter = bubbles.enter().append('g').attr('class', 'bubble')
          .attr('transform', d => `translate(${d.x},${d.y}) scale(0)`)
          .style('opacity', 0);

        enter.append('circle')
          .attr('r', d => getRadius(d.votes))
          .attr('fill', d => getBubbleColor(d))
          .attr('fill-opacity', 0.22)
          .attr('stroke', d => getBubbleColor(d))
          .attr('stroke-width', 2.5)
          .attr('filter', d => getBubbleGlow(d));

        enter.append('foreignObject')
          .attr('x', d => -getRadius(d.votes) * 0.7)
          .attr('y', d => -getRadius(d.votes) * 0.7)
          .attr('width', d => getRadius(d.votes) * 1.4)
          .attr('height', d => getRadius(d.votes) * 1.4)
          .append('xhtml:div')
          .attr('class', 'bubble-text')
          .text(d => d.text);

        // Vote badge
        enter.append('circle')
          .attr('class', 'badge-circle')
          .attr('cx', d => getRadius(d.votes) * 0.55)
          .attr('cy', d => -getRadius(d.votes) * 0.55)
          .attr('r', 14)
          .attr('fill', d => getBubbleColor(d))
          .attr('fill-opacity', 0.95);

        enter.append('text')
          .attr('class', 'badge-text')
          .attr('x', d => getRadius(d.votes) * 0.55)
          .attr('y', d => -getRadius(d.votes) * 0.55)
          .attr('text-anchor', 'middle')
          .attr('dominant-baseline', 'central')
          .attr('fill', '#fff')
          .attr('font-size', '11px')
          .attr('font-weight', '700')
          .text(d => d.votes);

        // Animate entrance
        enter.transition().duration(800)
          .ease(d3.easeElasticOut.amplitude(1).period(0.4))
          .attr('transform', d => `translate(${d.x},${d.y}) scale(1)`)
          .style('opacity', 1);

        // MERGE
        const merged = enter.merge(bubbles);

        merged.select('circle:first-child')
          .transition().duration(300)
          .attr('r', d => getRadius(d.votes))
          .attr('fill', d => getBubbleColor(d))
          .attr('stroke', d => getBubbleColor(d))
          .attr('filter', d => getBubbleGlow(d));

        merged.select('foreignObject')
          .attr('x', d => -getRadius(d.votes) * 0.7)
          .attr('y', d => -getRadius(d.votes) * 0.7)
          .attr('width', d => getRadius(d.votes) * 1.4)
          .attr('height', d => getRadius(d.votes) * 1.4)
          .select('.bubble-text')
          .text(d => d.text);

        merged.select('.badge-circle')
          .transition().duration(300)
          .attr('cx', d => getRadius(d.votes) * 0.55)
          .attr('cy', d => -getRadius(d.votes) * 0.55)
          .attr('fill', d => getBubbleColor(d));

        merged.select('.badge-text')
          .attr('x', d => getRadius(d.votes) * 0.55)
          .attr('y', d => -getRadius(d.votes) * 0.55)
          .text(d => d.votes);

        // Click handler
        merged.style('cursor', 'pointer').on('click', (event, d) => openSpotlight(d));

        // Restart simulation
        simulation.nodes(nodes);
        simulation.force('collision', d3.forceCollide(d => getRadius(d.votes) + 6).strength(0.9));
        simulation.alpha(0.4).restart();

        // Update spotlight if open
        if (spotlightId) {
          const q = nodes.find(n => n.id === spotlightId);
          if (q) {
            document.getElementById('spotlight-votes').textContent = q.votes;
          }
        }
      }

      // ─── Stats Animation ───
      const animatedStats = { questions: 0, votes: 0, connected: 0 };
      const targetStats = { questions: 0, votes: 0, connected: 0 };
      let statsAnimating = false;

      function updateStats(stats) {
        if (!stats) return;
        targetStats.questions = stats.totalQuestions || 0;
        targetStats.votes = stats.totalVotes || 0;
        targetStats.connected = stats.connectedUsers || 0;
        if (!statsAnimating) animateStats();
      }

      function animateStats() {
        statsAnimating = true;
        let done = true;
        for (const key of [ 'questions', 'votes', 'connected' ]) {
          if (animatedStats[ key ] !== targetStats[ key ]) {
            done = false;
            const diff = targetStats[ key ] - animatedStats[ key ];
            const step = diff > 0 ? Math.max(1, Math.ceil(diff * 0.15)) : Math.min(-1, Math.floor(diff * 0.15));
            animatedStats[ key ] += step;
            if ((diff > 0 && animatedStats[ key ] > targetStats[ key ]) || (diff < 0 && animatedStats[ key ] < targetStats[ key ])) {
              animatedStats[ key ] = targetStats[ key ];
            }
          }
        }
        document.getElementById('stat-questions').textContent = animatedStats.questions;
        document.getElementById('stat-votes').textContent = animatedStats.votes;
        document.getElementById('stat-connected').textContent = animatedStats.connected;
        if (!done) {
          requestAnimationFrame(animateStats);
        } else {
          statsAnimating = false;
        }
      }

      // ─── WebSocket ───
      let ws = null;

      function connect() {
        const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
        ws = new WebSocket(protocol + location.host);

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: 'join', role: 'display', clientId: 'display-main' }));
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === 'state') {
            renderState(msg.questions, msg.stats);
          }
        };

        ws.onclose = () => {
          setTimeout(connect, 2000);
        };

        ws.onerror = () => {
          ws.close();
        };
      }

      connect();

      // ─── Spotlight ───
      let spotlightId = null;
      const spotlightEl = document.getElementById('spotlight');

      function openSpotlight(d) {
        spotlightId = d.id;
        document.getElementById('spotlight-question').textContent = d.text;
        document.getElementById('spotlight-votes').textContent = d.votes;
        spotlightEl.style.display = 'flex';
        requestAnimationFrame(() => spotlightEl.classList.add('open'));
      }

      function closeSpotlight() {
        spotlightEl.classList.remove('open');
        setTimeout(() => {
          spotlightEl.style.display = 'none';
          spotlightId = null;
        }, 300);
      }

      spotlightEl.addEventListener('click', (e) => {
        if (e.target === spotlightEl) closeSpotlight();
      });

      window.closeSpotlight = closeSpotlight;

      // ─── QR Code Overlay ───
      const qrOverlay = document.getElementById('qr-overlay');
      let qrOpen = false;
      let currentQrUrl = '';
      let qrPollTimer = null;

      async function fetchInfo() {
        try {
          const res = await fetch('/api/info');
          return await res.json();
        } catch {
          return null;
        }
      }

      function buildQr(info) {
        if (!info) return;
        const mobileUrl = info.url + '/mobile.html';
        if (mobileUrl === currentQrUrl) return;
        currentQrUrl = mobileUrl;

        const container = document.getElementById('qr-container');
        container.innerHTML = '';
        new QRCode(container, {
          text: mobileUrl,
          width: 220,
          height: 220,
          colorDark: '#000',
          colorLight: '#fff',
          correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById('qr-url').textContent = mobileUrl;

        const badgeContainer = document.getElementById('qr-badge-container');
        if (info.tunnelUrl) {
          badgeContainer.innerHTML = '<span class="qr-badge public">🌐 Public URL</span>';
        } else {
          badgeContainer.innerHTML = '<span class="qr-badge local">📡 Local network only</span>';
        }
      }

      async function openQr() {
        qrOpen = true;
        qrOverlay.style.display = 'flex';
        requestAnimationFrame(() => qrOverlay.classList.add('open'));
        const info = await fetchInfo();
        buildQr(info);
        qrPollTimer = setInterval(async () => {
          const info = await fetchInfo();
          buildQr(info);
        }, 5000);
      }

      function closeQr() {
        qrOpen = false;
        qrOverlay.classList.remove('open');
        setTimeout(() => { qrOverlay.style.display = 'none'; }, 300);
        if (qrPollTimer) { clearInterval(qrPollTimer); qrPollTimer = null; }
        currentQrUrl = '';
      }

      function toggleQr() {
        if (qrOpen) closeQr(); else openQr();
      }

      qrOverlay.addEventListener('click', (e) => {
        if (e.target === qrOverlay) closeQr();
      });

      // ─── Simulation Mode ───
      let simulating = false;
      let simTimer = null;
      const simBanner = document.getElementById('sim-banner');

      const simQuestions = [
        "What's the biggest challenge we face this year?",
        "How can we improve onboarding?",
        "Should we invest more in developer tooling?",
        "What's one process you'd eliminate?",
        "How do you feel about hybrid work?",
        "What would you build with a free week?",
        "How can we improve cross-team communication?",
        "What training would help you grow?",
        "Should we host more social events?",
        "How can leadership be more transparent?"
      ];

      function simTick() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const clientId = 'sim-' + Math.random().toString(36).slice(2, 8);

        if (Math.random() < 0.3) {
          const text = simQuestions[ Math.floor(Math.random() * simQuestions.length) ];
          ws.send(JSON.stringify({ type: 'submit', text, clientId }));
        } else if (nodes.length > 0) {
          const idx = Math.floor(Math.random() * Math.random() * nodes.length);
          const node = nodes[ idx ];
          ws.send(JSON.stringify({ type: 'upvote', questionId: node.id, clientId }));
        }
      }

      function toggleSimulation() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (simulating) {
          simulating = false;
          clearInterval(simTimer);
          simTimer = null;
          simBanner.style.display = 'none';
        } else {
          simulating = true;
          simBanner.style.display = 'block';
          simTimer = setInterval(simTick, 400);
        }
      }

      // ─── Keyboard Shortcuts ───
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const key = e.key.toLowerCase();

        if (key === 'escape') {
          if (qrOpen) closeQr();
          else if (spotlightId) closeSpotlight();
          return;
        }
        if (key === 'q') { toggleQr(); return; }
        if (key === 's') { toggleSimulation(); return; }
        if (key === 'f') {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => { });
          } else {
            document.exitFullscreen().catch(() => { });
          }
          return;
        }
        if (key === 'r') {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'reset' }));
          }
          return;
        }
      });

      // ─── Resize ───
      window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        svg.attr('width', W).attr('height', H);
        starCanvas.width = W;
        starCanvas.height = H;
        initStars();
        simulation.force('center', d3.forceCenter(W / 2, H / 2));
        simulation.force('x', d3.forceX(W / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)));
        simulation.force('y', d3.forceY(H / 2).strength(d => 0.02 + Math.min(0.06, d.votes * 0.002)));
        simulation.alpha(0.3).restart();
      });
    })();
  </script>
</body>

</html>
